events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Use Docker's internal DNS resolver
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;
    client_max_body_size 500M;

    # Serve mobile capture static (mounted into /usr/share/nginx/html/capture)
    location /capture/ {
      alias /usr/share/nginx/html/capture/;
      autoindex off;
      try_files $uri $uri/ /capture/index.html;
    }

    # Serve admin frontend from mind-web-main-frontend container
    location / {
      # Use variable to force DNS resolution at runtime
      set $frontend_upstream http://mind-web-main-frontend:80;
      proxy_pass $frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to ai-api container
    location /ai/api/ {
      # Use variable to force DNS resolution at runtime
      set $api_upstream http://ai-api:5000;
      # Rewrite to strip /ai/api/ prefix when using variable in proxy_pass
      rewrite ^/ai/api/(.*)$ /$1 break;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
