server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Disable caching for HTML to always get latest version
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri /index.html;
    }

    # Disable caching for JS and CSS during development
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location / {
        try_files $uri /index.html;
    }
}
